<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ステージレース紹介サイト — Design Canvas</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Noto Sans JP", sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js?v=2"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script src="continents.js"></script>
<script type="text/babel" src="reports.jsx"></script>
<script type="text/babel" src="worldmap.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="races.jsx"></script>
<script type="text/babel" src="detail.jsx"></script>
<script type="text/babel" src="about.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "desert",
  "displayFont": "oswald",
  "cardStyle": "overlay"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const palette = PALETTES[t.palette] || PALETTES.desert;
  const displayFont = DISPLAY_FONTS[t.displayFont] || DISPLAY_FONTS.oswald;

  // Frame: 各ページのデザインを 1440 幅で表示する artboard
  const W = 1440;

  return (
    <>
      <DesignCanvas>
        <DCSection id="home" title="トップページ" subtitle="2案 — シネマティック / 編集グリッド">
          <DCArtboard id="home-a" label="A · Cinematic Hero" width={W} height={1820}>
            <HomePageA races={SAMPLE_RACES} palette={palette} displayFont={displayFont} />
          </DCArtboard>
          <DCArtboard id="home-b" label="B · Editorial Grid" width={W} height={1900}>
            <HomePageB races={SAMPLE_RACES} palette={palette} displayFont={displayFont} />
          </DCArtboard>
        </DCSection>

        <DCSection id="races" title="レース一覧" subtitle="2案 — オーバーレイ・グリッド / インデックス">
          <DCArtboard id="races-a" label="A · Map + Grid" width={W} height={2900}>
            <RaceListPageA races={SAMPLE_RACES} palette={palette} displayFont={displayFont} cardStyle={t.cardStyle} />
          </DCArtboard>
          <DCArtboard id="races-b" label="B · Editorial Index" width={W} height={1700}>
            <RaceListPageB races={SAMPLE_RACES} palette={palette} displayFont={displayFont} />
          </DCArtboard>
        </DCSection>

        <DCSection id="detail" title="レース詳細" subtitle="2案 — チャプタータブ / 縦スクロール章">
          <DCArtboard id="detail-a" label="A · Chapter Tabs" width={W} height={1900}>
            <RaceDetailPageA race={SAMPLE_DETAIL} reports={SAMPLE_REPORTS} palette={palette} displayFont={displayFont} />
          </DCArtboard>
          <DCArtboard id="detail-b" label="B · Long-form Chapters" width={W} height={4400}>
            <RaceDetailPageB race={SAMPLE_DETAIL} reports={SAMPLE_REPORTS} palette={palette} displayFont={displayFont} />
          </DCArtboard>
        </DCSection>

        <DCSection id="about" title="About" subtitle="運営・編集方針・寄稿者">
          <DCArtboard id="about-a" label="About" width={W} height={2000}>
            <AboutPage palette={palette} displayFont={displayFont} contributors={SAMPLE_CONTRIBUTORS} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Palette" />
        <TweakRadio label="Color" value={t.palette}
          options={[
            { value: 'desert', label: 'Desert' },
            { value: 'mountain', label: 'Mountain' },
            { value: 'polar', label: 'Polar' },
          ]}
          onChange={(v) => setTweak('palette', v)} />

        <TweakSection label="Typography" />
        <TweakSelect label="Display font" value={t.displayFont}
          options={[
            { value: 'oswald', label: 'Oswald' },
            { value: 'bebas', label: 'Bebas Neue' },
            { value: 'barlow', label: 'Barlow Condensed' },
            { value: 'archivo', label: 'Archivo Narrow' },
          ]}
          onChange={(v) => setTweak('displayFont', v)} />

        <TweakSection label="Race Card (一覧A)" />
        <TweakRadio label="Style" value={t.cardStyle}
          options={[
            { value: 'overlay', label: 'Overlay' },
            { value: 'split', label: 'Split' },
            { value: 'minimal', label: 'Minimal' },
          ]}
          onChange={(v) => setTweak('cardStyle', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
