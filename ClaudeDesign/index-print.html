<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ステージレース紹介サイト — Print</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Noto Sans JP", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { box-sizing: border-box; }

  .page {
    width: 1440px;
    background: #fff;
    margin: 0 auto 24px;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
    break-inside: avoid;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .page-label {
    width: 1440px;
    margin: 24px auto 8px;
    font-family: "Oswald", "Noto Sans JP", sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5C4F3C;
    padding: 0 8px;
  }
  .page-label .num { color: #B8763A; margin-right: 12px; font-weight: 600; }

  @page {
    size: 1440px auto;
    margin: 0;
  }

  @media print {
    body { background: #fff; }
    .page-label { margin: 12px auto 6px; }
    .page { margin: 0 auto 0; box-shadow: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="races.jsx"></script>
<script type="text/babel" src="detail.jsx"></script>
<script type="text/babel" src="about.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const palette = PALETTES.desert;
const displayFont = DISPLAY_FONTS.oswald;

const PAGES = [
  { num: '01', label: 'Home · A — Cinematic Hero', node: <HomePageA races={SAMPLE_RACES} palette={palette} displayFont={displayFont} /> },
  { num: '02', label: 'Home · B — Editorial Grid', node: <HomePageB races={SAMPLE_RACES} palette={palette} displayFont={displayFont} /> },
  { num: '03', label: 'Race List · A — Sidebar + Grid + MiniMap', node: <RaceListPageA races={SAMPLE_RACES} palette={palette} displayFont={displayFont} cardStyle="overlay" /> },
  { num: '04', label: 'Race List · B — Editorial Index', node: <RaceListPageB races={SAMPLE_RACES} palette={palette} displayFont={displayFont} /> },
  { num: '05', label: 'Race Detail · A — Chapter Tabs (Overview)', node: <RaceDetailPageA race={SAMPLE_DETAIL} palette={palette} displayFont={displayFont} /> },
  { num: '06', label: 'Race Detail · B — Long-form Chapters', node: <RaceDetailPageB race={SAMPLE_DETAIL} palette={palette} displayFont={displayFont} /> },
  { num: '07', label: 'About', node: <AboutPage palette={palette} displayFont={displayFont} contributors={SAMPLE_CONTRIBUTORS} /> },
];

function PrintApp() {
  return (
    <>
      {PAGES.map(p => (
        <React.Fragment key={p.num}>
          <div className="page-label">
            <span className="num">{p.num}</span>{p.label}
          </div>
          <div className="page">{p.node}</div>
        </React.Fragment>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

// Auto-print after fonts and renders settle
(async () => {
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) {}
  await new Promise(r => setTimeout(r, 1500));
  window.print();
})();
</script>
</body>
</html>
